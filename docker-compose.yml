services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tarrasque
      POSTGRES_PASSWORD: tarrasque
      POSTGRES_DB: tarrasque
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tarrasque']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
